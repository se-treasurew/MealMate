name: 发布检查

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: v1.0 发布门禁
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      CORS_ORIGINS: https://mealmate.example.invalid

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描提交中的敏感信息
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成一次性 CI 密钥
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_INITIAL_PASSWORD=CI-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: 配置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 检查 HEAD 发布路径
        run: python scripts/check_release_tree.py --mode head

      - name: 测试发布扫描器
        run: python -m unittest scripts.test_check_release_tree -v

      - name: 安装后端依赖与 pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pip-audit>=2.9,<3"

      - name: 后端单元测试
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: 后端隔离 E2E
        working-directory: backend
        run: python run_e2e.py

      - name: 审计 Python 运行依赖
        run: pip-audit --requirement backend/requirements.txt

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: 审计前端运行依赖
        working-directory: frontend
        run: npm audit --omit=dev

      - name: 检查生产构建未固化本地后端
        run: python scripts/check_release_tree.py --mode head --check-dist

      - name: 验证 Docker Compose 配置
        run: docker compose config

      - name: 验证 Caddy 配置
        run: >-
          docker run --rm
          --volume "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: 构建 backend 与 frontend 镜像
        run: docker compose build backend frontend

      - name: 验证前端 Nginx 配置
        run: docker compose run --rm --no-deps frontend nginx -t

      - name: 验证代理层在 multipart 解析前拒绝超大请求
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs
              exit 1
            fi
            sleep 1
          done
          dd if=/dev/zero of=/tmp/mealmate-allowed-body.png bs=1M count=2 status=none
          allowed_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --form 'file=@/tmp/mealmate-allowed-body.png;type=image/png' \
            http://127.0.0.1/api/auth/avatar)
          test "$allowed_status" = "401"
          dd if=/dev/zero of=/tmp/mealmate-oversized.png bs=1M count=7 status=none
          status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --form 'file=@/tmp/mealmate-oversized.png;type=image/png' \
            http://127.0.0.1/api/auth/avatar)
          test "$status_code" = "413"
